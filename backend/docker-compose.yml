# Local development: PostgreSQL, Redis, 2 API copies behind nginx, and 1 worker.
# Usage: docker compose up --build   then open http://localhost:3000/pages/index.html
# Run tests against the same services: npm test (with TEST_DATABASE_URL / TEST_REDIS_URL below).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kagobuild
      POSTGRES_PASSWORD: kagobuild
      POSTGRES_DB: kagobuild
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kagobuild"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["node", "scripts/migrate.js"]
    environment: &env
      NODE_ENV: development
      DATABASE_URL: postgres://kagobuild:kagobuild@postgres:5432/kagobuild
      REDIS_URL: redis://redis:6379
      PUBLIC_ORIGIN: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      SERVE_FRONTEND: "false"
      AI_PROVIDER: template
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    environment: *env
    deploy:
      replicas: 2
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ["node", "src/worker.js"]
    environment: *env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  proxy:
    image: nginx:1.27-alpine
    ports: ["3000:80"]
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on: [api]
