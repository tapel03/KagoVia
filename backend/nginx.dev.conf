# Development load balancer: static frontend + API copies. Production uses the managed edge
# (CDN/WAF -> load balancer -> reverse proxy/gateway), see docs/sys_doc/06-operations/01-deployment.md.
upstream kagobuild_api {
  server api:3000;   # Docker DNS resolves to every api replica
  keepalive 32;
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  client_max_body_size 256k;

  location /pages/ { root /usr/share/nginx/html; }
  location /styles/ { root /usr/share/nginx/html; }
  location /scripts/ { root /usr/share/nginx/html; }
  location /assets/ { root /usr/share/nginx/html; }
  location /utils/ { root /usr/share/nginx/html; }

  location / {
    proxy_pass http://kagobuild_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;          # WebSocket chat
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;                             # SSE must not be buffered
    proxy_read_timeout 1h;
  }
}
