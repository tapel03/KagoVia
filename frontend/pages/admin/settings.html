<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Settings | KagoBuild Admin</title>
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/dash.css">
    <link rel="stylesheet" href="../../styles/admin.css">
    <link rel="stylesheet" href="../../styles/admin-extra.css">
    <link rel="stylesheet" href="../../styles/office-export.css">
</head>
<body data-title="My settings">
    <main class="admin-page" id="app"></main>

    <script src="../../scripts/admin-shell.js"></script>
    <script src="../../scripts/office-export.js"></script>
    <script src="../../scripts/admin-ui.js"></script>
    <script src="../../scripts/photo-crop.js"></script>
    <script>
        var app = document.getElementById('app');
        var saved = AdminShell.getSettings();
        var E = AdminUI.esc;

        app.innerHTML =
            '<div class="settings-page kb-settings">' +
                '<nav class="settings-tabs" role="tablist" aria-label="Settings sections">' +
                    '<button type="button" class="settings-tab active" role="tab" data-tab="profile" aria-selected="true" aria-controls="panel-profile"><svg class="kb-tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</button>' +
                    '<button type="button" class="settings-tab" role="tab" data-tab="security" aria-selected="false" aria-controls="panel-security"><svg class="kb-tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>Security</button>' +
                    '<button type="button" class="settings-tab" role="tab" data-tab="preferences" aria-selected="false" aria-controls="panel-preferences"><svg class="kb-tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>Preferences</button>' +
                    '<button type="button" class="settings-tab" role="tab" data-tab="sessions" aria-selected="false" aria-controls="panel-sessions"><svg class="kb-tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>Sessions</button>' +
                '</nav>' +

                /* ---------- Profile ---------- */
                '<div class="settings-panel" id="panel-profile" role="tabpanel"><div class="settings-cards-row">' +
                    '<div class="settings-card">' +
                        '<h5>Profile Information</h5>' +
                        '<p class="settings-card-sub">Update your personal information and profile details.</p>' +
                        '<div class="profile-photo-block">' +
                            '<span class="kb-avatar-lg"><span id="pInitials"></span><img id="pImg" alt="Profile photo"></span>' +
                            '<div class="photo-actions">' +
                                '<button type="button" class="change-photo-btn" id="pChange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>Change Photo</button>' +
                                '<button type="button" class="link-btn" id="pRemove">Remove</button>' +
                                '<input type="file" id="pFile" accept="image/*" hidden>' +
                            '</div>' +
                        '</div>' +
                        '<div class="settings-fields-grid">' +
                            '<div class="settings-field"><label for="pName">Full Name</label><input id="pName" type="text" value="' + E(saved['profile.name'] || 'Moses') + '"></div>' +
                            '<div class="settings-field"><label for="pEmail">Email Address</label><input id="pEmail" type="email" value="' + E(saved['profile.email'] || 'admin@kagobuild.com') + '"></div>' +
                            '<div class="settings-field"><label for="pPhone">Phone Number</label><input id="pPhone" type="text" value="' + E(saved['profile.phone'] || '') + '" placeholder="+27 ..."></div>' +
                            '<div class="settings-field"><label for="pRole">Role</label><input id="pRole" type="text" value="' + E(AdminShell.role) + '" disabled></div>' +
                        '</div>' +
                        '<p class="field-error" id="pErr" role="alert"></p>' +
                        '<div class="settings-card-actions"><button type="button" class="settings-save-btn" id="pSave">Save Changes</button></div>' +
                    '</div>' +
                '</div></div>' +

                /* ---------- Security ---------- */
                '<div class="settings-panel is-hidden" id="panel-security" role="tabpanel"><div class="settings-cards-row">' +
                    '<div class="settings-card">' +
                        '<h5>Two-Factor Authentication</h5>' +
                        '<p class="settings-card-sub">Add an extra step when you sign in to the admin area.</p>' +
                        '<div class="toggle-row"><div><strong>Authenticator app</strong><span>Ask for a code from your authenticator app at sign-in.</span></div>' +
                            '<label class="switch"><input type="checkbox" id="tfa" ' + (saved['security.tfa'] === false ? '' : 'checked') + '><span></span></label></div>' +
                    '</div>' +
                    '<div class="settings-card">' +
                        '<h5>Change Password</h5>' +
                        '<p class="settings-card-sub">Update your password regularly to keep your account secure.</p>' +
                        '<div class="settings-field"><label for="pwOld">Current Password</label><input id="pwOld" type="password" placeholder="Enter current password" autocomplete="current-password"></div>' +
                        '<div class="settings-field"><label for="pwNew">New Password</label><input id="pwNew" type="password" placeholder="Enter new password" autocomplete="new-password"><small class="field-hint">At least 8 characters.</small></div>' +
                        '<div class="settings-field"><label for="pwConf">Confirm New Password</label><input id="pwConf" type="password" placeholder="Confirm new password" autocomplete="new-password"></div>' +
                        '<p class="field-error" id="pwErr" role="alert"></p>' +
                        '<div class="settings-card-actions"><button type="button" class="settings-save-btn" id="pwSave">Update Password</button></div>' +
                    '</div>' +
                '</div></div>' +

                /* ---------- Preferences ---------- */
                '<div class="settings-panel is-hidden" id="panel-preferences" role="tabpanel"><div class="settings-cards-row">' +
                    '<div class="settings-card">' +
                        '<h5>Application Preferences</h5>' +
                        '<p class="settings-card-sub">Customize how the admin area works for you.</p>' +
                        '<div class="settings-fields-grid">' +
                            '<div class="settings-field"><label for="prefTheme">Theme</label><select id="prefTheme"><option value="light">Light</option><option value="dark">Dark</option></select></div>' +
                            '<div class="settings-field"><label for="prefTz">Time zone</label><select id="prefTz"><option>Africa/Johannesburg (SAST)</option><option>UTC</option><option>Europe/London</option></select></div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="settings-card">' +
                        '<h5>Alerts</h5>' +
                        '<p class="settings-card-sub">Choose what the admin area emails you about.</p>' +
                        '<div class="toggle-row"><div><strong>Email alerts</strong><span>Supplier sync failures and AI queue backlogs.</span></div><label class="switch"><input type="checkbox" data-pref="pref.emailAlerts" ' + (saved['pref.emailAlerts'] === false ? '' : 'checked') + '><span></span></label></div>' +
                        '<div class="toggle-row"><div><strong>Security notices</strong><span>New sign-ins and permission changes.</span></div><label class="switch"><input type="checkbox" data-pref="pref.securityNotices" ' + (saved['pref.securityNotices'] === false ? '' : 'checked') + '><span></span></label></div>' +
                    '</div>' +
                '</div></div>' +

                /* ---------- Sessions ---------- */
                '<div class="settings-panel is-hidden" id="panel-sessions" role="tabpanel"><div class="settings-cards-row"><div id="sessions"></div></div></div>' +
            '</div>';

        /* ---------- Tabs (same behaviour as the user Settings page) ---------- */
        var tabs = app.querySelectorAll('.settings-tab');
        function showTab(name) {
            if (!document.getElementById('panel-' + name)) return;
            tabs.forEach(function (t) {
                var on = t.getAttribute('data-tab') === name;
                t.classList.toggle('active', on);
                t.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            app.querySelectorAll('.settings-panel').forEach(function (p) {
                p.classList.toggle('is-hidden', p.id !== 'panel-' + name);
            });
        }
        tabs.forEach(function (t) {
            t.onclick = function () {
                var name = t.getAttribute('data-tab');
                showTab(name);
                try { history.replaceState(null, '', '#' + name); } catch (e) {}
            };
        });

        /* ---------- Profile ---------- */
        var pName = document.getElementById('pName');
        var pImg = document.getElementById('pImg');
        var pInitials = document.getElementById('pInitials');
        var pErr = document.getElementById('pErr');

        function initials(n) {
            var p = n.trim().split(/\s+/);
            return (((p[0] || '')[0] || '') + ((p[1] || '')[0] || '')).toUpperCase();
        }
        function paintPreview() {
            pInitials.textContent = initials(pName.value || 'M');
            var photo = AdminShell.getSettings()['profile.photo'];
            if (photo) pImg.src = photo; else pImg.removeAttribute('src');
            pImg.hidden = !photo;
            pInitials.hidden = !!photo;
            document.getElementById('pRemove').hidden = !photo;
        }
        paintPreview();
        pName.oninput = function () { pInitials.textContent = initials(pName.value || 'M'); };

        document.getElementById('pChange').onclick = function () { document.getElementById('pFile').click(); };

        document.getElementById('pFile').onchange = function (e) {
            var file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            if (file.type.indexOf('image/') !== 0) { AdminUI.toast('Please choose an image file'); return; }
            if (file.size > 8 * 1024 * 1024) { AdminUI.toast('Image is too large (max 8MB)'); return; }
            // Frame the face in a circle, then save a 256px copy
            KBPhotoCrop.open(file, function (dataUrl) {
                AdminShell.saveSettings({ 'profile.photo': dataUrl });
                paintPreview();
                AdminUI.toast('Photo updated');
            });
        };

        document.getElementById('pRemove').onclick = function () {
            AdminShell.saveSettings({ 'profile.photo': null });
            paintPreview();
            AdminUI.toast('Photo removed');
        };

        document.getElementById('pSave').onclick = function () {
            var name = pName.value.trim();
            var email = document.getElementById('pEmail').value.trim();
            if (!name) { pErr.textContent = 'Please enter your name.'; return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { pErr.textContent = 'Please enter a valid email address.'; return; }
            pErr.textContent = '';
            AdminShell.saveSettings({
                'profile.name': name,
                'profile.email': email,
                'profile.phone': document.getElementById('pPhone').value.trim()
            });
            paintPreview();
            AdminUI.toast('Profile saved');
        };

        /* ---------- Security ---------- */
        document.getElementById('tfa').onchange = function (e) {
            AdminShell.saveSettings({ 'security.tfa': e.target.checked });
            AdminUI.toast('Two-factor authentication ' + (e.target.checked ? 'enabled' : 'disabled'));
        };

        document.getElementById('pwSave').onclick = function () {
            var o = document.getElementById('pwOld').value;
            var n = document.getElementById('pwNew').value;
            var c = document.getElementById('pwConf').value;
            var err = document.getElementById('pwErr');
            if (!o) { err.textContent = 'Enter your current password.'; return; }
            if (n.length < 8) { err.textContent = 'New password must be at least 8 characters.'; return; }
            if (n !== c) { err.textContent = 'The new passwords do not match.'; return; }
            err.textContent = '';
            ['pwOld', 'pwNew', 'pwConf'].forEach(function (id) { document.getElementById(id).value = ''; });
            AdminUI.toast('Password updated (demo only, not sent to a server)');
        };

        /* ---------- Preferences ---------- */
        var themeSel = document.getElementById('prefTheme');
        themeSel.value = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        themeSel.onchange = function () {
            document.documentElement.setAttribute('data-theme', themeSel.value);
            try { localStorage.setItem('kb-theme', themeSel.value); } catch (e) {}
            AdminUI.toast('Theme set to ' + themeSel.value);
        };

        var tzSel = document.getElementById('prefTz');
        if (saved['pref.tz']) tzSel.value = saved['pref.tz'];
        tzSel.onchange = function () { AdminShell.saveSettings({ 'pref.tz': tzSel.value }); AdminUI.toast('Time zone saved'); };

        document.querySelectorAll('[data-pref]').forEach(function (s) {
            s.onchange = function () {
                var patch = {};
                patch[s.getAttribute('data-pref')] = s.checked;
                AdminShell.saveSettings(patch);
                AdminUI.toast('Preference saved');
            };
        });

        /* ---------- Active sessions ---------- */
        AdminUI.crud(document.getElementById('sessions'), {
            title: 'Active sessions',
            readOnly: true,
            columns: [
                { key: 'device', label: 'Device' },
                { key: 'ip', label: 'IP address' },
                { key: 'last', label: 'Last active' },
                { key: 'status', label: 'Status', type: 'status', options: [['This device', 'ok'], ['Other', 'neutral']] }
            ],
            rows: [
                { device: 'Chrome on Windows', ip: '102.132.4.18', last: 'Now', status: 'This device' },
                { device: 'Safari on iPhone', ip: '102.132.7.41', last: '2 hours ago', status: 'Other' },
                { device: 'Firefox on macOS', ip: '41.76.12.200', last: 'Yesterday', status: 'Other' }
            ],
            actions: [
                { label: 'Sign out', show: function (r) { return r.status !== 'This device'; },
                  run: function (r, api) {
                      api.rows.splice(api.rows.indexOf(r), 1);
                      api.toast('Signed out of ' + r.device);
                  } }
            ]
        });

        /* Open a tab from the link, e.g. settings.html#security */
        if (location.hash) showTab(location.hash.slice(1));
    </script>
</body>
</html>
